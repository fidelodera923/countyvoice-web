<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Promises vs Delivery – CountyVoice</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-teal-700 text-white shadow-lg">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="font-bold text-xl"><i class="fas fa-comments mr-2"></i>CountyVoice</a>
      <a href="index.html" class="text-sm hover:text-teal-200">Home</a>
    </div>
  </nav>
  <main class="max-w-4xl mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold mb-2">Promises vs Delivery</h1>
    <p class="text-gray-600 mb-6">County projects and reported progress</p>
    <div id="list" class="space-y-4"></div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    CountyVoice.getPromises().then(items => {
      const box = document.getElementById('list');
      if (!items.length) {
        box.innerHTML = '<p class="text-gray-500 text-center py-10">No promises published yet.</p>';
        return;
      }
      box.innerHTML = items.map(p => `
        <div class="bg-white border rounded-xl p-5 shadow-sm">
          <div class="flex justify-between gap-2 mb-1">
            <h3 class="font-semibold">${CountyVoice.escapeHtml(p.title)}</h3>
            <span class="text-xs bg-gray-100 px-2 py-1 rounded">${CountyVoice.escapeHtml(p.status)}</span>
          </div>
          <p class="text-sm text-gray-600">${CountyVoice.escapeHtml(p.sector)} · ${CountyVoice.escapeHtml(p.budget)} · ${CountyVoice.escapeHtml(p.year)}</p>
          <div class="mt-3">
            <div class="flex justify-between text-xs text-gray-500 mb-1"><span>Progress</span><span>${p.progress || 0}%</span></div>
            <div class="h-2 bg-gray-100 rounded-full overflow-hidden">
              <div class="h-full bg-teal-600 rounded-full" style="width:${Math.min(100, p.progress || 0)}%"></div>
            </div>
          </div>
          ${p.notes ? `<p class="text-sm text-gray-600 mt-3">${CountyVoice.escapeHtml(p.notes)}</p>` : ''}
        </div>
      `).join('');
    }).catch(e => {
      document.getElementById('list').innerHTML = `<p class="text-red-600">${CountyVoice.escapeHtml(e.message)}</p>`;
    });
  </script>
</body>
</html>
